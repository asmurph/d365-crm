services:
  app-dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  app-prod:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
    profiles:
      - prod
